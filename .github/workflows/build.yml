name: Check blueprints

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      blueprints: ${{ steps.list.outputs.blueprints }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "blueprints=$(ls -d blueprints/*/module | cut -d / -f 2 | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blueprint: ${{ fromJson(needs.discover.outputs.blueprints) }}
    defaults:
      run:
        working-directory: blueprints/${{ matrix.blueprint }}/module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry==2.1.3
      - run: poetry check --lock
      - name: Run the unit tests
        run: |
          if [ -d tests ]; then
            poetry install --no-root
            poetry run pytest
          else
            echo "No tests in ${{ matrix.blueprint }}"
          fi

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blueprint: ${{ fromJson(needs.discover.outputs.blueprints) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the module image for every target architecture (no push)
        run: docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v7 blueprints/${{ matrix.blueprint }}/module
